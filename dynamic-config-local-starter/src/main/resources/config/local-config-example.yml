# 本地配置文件示例
# 支持YAML格式的配置

app:
  name: "Dynamic Config Demo"
  version: "1.0.0"
  
database:
  url: "jdbc:mysql://localhost:3306/demo"
  username: "root"
  password: "password"
  
redis:
  host: "localhost"
  port: 6379
  password: ""
  
logging:
  level: "INFO"
  file: "logs/app.log"
  
features:
  cache: true
  monitoring: true
  debug: false 